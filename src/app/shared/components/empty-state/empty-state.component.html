<div class="empty-state-card">
  <div class="empty-icon-wrapper" [ngClass]="getIconColorClass()">
    <i [class]="icon()" class="empty-icon"></i>
  </div>
  <h3 class="empty-title">{{ title() }}</h3>
  <p class="empty-description">{{ description() }}</p>
  
  @if (actionLabel()) {
    <div class="empty-action-wrapper">
      <p-button 
        [label]="actionLabel()!" 
        [icon]="actionIcon() || ''" 
        severity="primary" 
        [disabled]="actionDisabled()" 
        (onClick)="onActionClick()">
      </p-button>
    </div>
  }
</div>
