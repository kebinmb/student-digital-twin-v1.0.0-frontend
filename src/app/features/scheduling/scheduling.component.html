<div class="scheduling-container">
  <!-- Institutional Sticky Header Toolbar -->
  <div class="scheduling-toolbar-card">
    <div class="header-branding">
      <div class="header-icon-box">
        <i class="pi pi-calendar-plus header-icon"></i>
      </div>
      <div>
        <h1 class="header-title">Scheduling & Timetable Management</h1>
        <p class="header-subtitle">CHED CMO No. 25, s. 2015 Compliant Course Section Allocator & Timetable Grid</p>
      </div>
    </div>

    <!-- View Switcher Tabs -->
    <div class="view-switcher-group">
      <p-selectbutton 
        [options]="viewOptions" 
        [ngModel]="activeTab()" 
        (ngModelChange)="setTab($event)" 
        optionLabel="label" 
        optionValue="value"
        styleClass="scheduling-view-switcher">
        <ng-template let-item pTemplate="item">
          <div class="switcher-item-wrapper">
            <i [class]="item.icon"></i>
            <span class="switcher-item-label">{{ item.label }}</span>
          </div>
        </ng-template>
      </p-selectbutton>
    </div>
  </div>

  <!-- Active View Container -->
  <div class="tab-content">
    @if (activeTab() === 'sections') {
      <app-section-builder></app-section-builder>
    } @else {
      <app-timetable-grid (addSchedule)="setTab('sections')"></app-timetable-grid>
    }
  </div>
</div>
